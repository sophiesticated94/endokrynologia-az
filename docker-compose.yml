services:
  postgres:
    image: postgres:16-alpine
    container_name: endokrynologia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: endokrynologia_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d endokrynologia_dev"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
